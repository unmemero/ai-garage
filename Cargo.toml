[workspace]
resolver = "2"
members = [
    "crates/chassis-protocol",
    "crates/chassis-core",
    "crates/chassis-cli",
    "crates/plugins/chassis-model-local",
    "crates/plugins/chassis-tools-filesystem",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sovereign AI Core Team"]
license = "MIT"
repository = "https://github.com/ai-garage/chassis"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
